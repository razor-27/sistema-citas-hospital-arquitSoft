<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="1440" height="920" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img"><title>Diagrama de secuencia de Reserva Atómica con Distributed Lock</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E293B"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1E293B" stroke-width="1.4"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="38" font-size="18" font-weight="700" fill="#1A1A1A">[Diagrama de secuencia UML] Flujo de Reserva Atómica con Distributed Lock</text><text x="40" y="60" font-size="12" fill="#555555">Modelo C4 · Nivel 4 · Interacción temporal entre controladores, caso de uso, Redis, PostgreSQL y Colas</text><text x="1400" y="38" font-size="11" fill="#777777" text-anchor="end">Vista de código · v1.0</text><g transform="translate(60, 80)"><rect width="110" height="40" rx="4" fill="#08427B"/><text x="55" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Paciente / Web</text><line x1="55" y1="40" x2="55" y2="760" stroke="#08427B" stroke-dasharray="4 4"/></g><g transform="translate(200, 80)"><rect width="120" height="40" rx="4" fill="#4A90E2"/><text x="60" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">CitaController</text><line x1="60" y1="40" x2="60" y2="760" stroke="#4A90E2" stroke-dasharray="4 4"/></g><g transform="translate(360, 80)"><rect width="150" height="40" rx="4" fill="#2E7D32"/><text x="75" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">ReservarCitaUseCase</text><line x1="75" y1="40" x2="75" y2="760" stroke="#2E7D32" stroke-dasharray="4 4"/></g><g transform="translate(540, 80)"><rect width="130" height="40" rx="4" fill="#8E24AA"/><text x="65" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">RedisLockAdapter</text><line x1="65" y1="40" x2="65" y2="760" stroke="#8E24AA" stroke-dasharray="4 4"/></g><g transform="translate(700, 80)"><rect width="150" height="40" rx="4" fill="#8E24AA"/><text x="75" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">PostgresTurnoRepo</text><line x1="75" y1="40" x2="75" y2="760" stroke="#8E24AA" stroke-dasharray="4 4"/></g><g transform="translate(880, 80)"><rect width="140" height="40" rx="4" fill="#F57F17"/><text x="70" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">PoliticaReservaService</text><line x1="70" y1="40" x2="70" y2="760" stroke="#F57F17" stroke-dasharray="4 4"/></g><g transform="translate(1050, 80)"><rect width="130" height="40" rx="4" fill="#8E24AA"/><text x="65" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">PostgresCitaRepo</text><line x1="65" y1="40" x2="65" y2="760" stroke="#8E24AA" stroke-dasharray="4 4"/></g><g transform="translate(1210, 80)"><rect width="140" height="40" rx="4" fill="#8E24AA"/><text x="70" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">RabbitMQEventPub</text><line x1="70" y1="40" x2="70" y2="760" stroke="#8E24AA" stroke-dasharray="4 4"/></g><path d="M115,150 L255,150" stroke="#1E293B" stroke-width="1.4" marker-end="url(#arr)"/><text x="185" y="142" font-size="10" fill="#1E293B" text-anchor="middle">1: POST /api/v1/citas (slotId, pacienteId)</text><path d="M260,180 L430,180" stroke="#1E293B" stroke-width="1.4" marker-end="url(#arr)"/><text x="345" y="172" font-size="10" fill="#1E293B" text-anchor="middle">2: ejecutar(ReservarCitaDTO)</text><rect x="370" y="205" width="280" height="70" fill="#EDE7F6" stroke="#B39DDB" stroke-dasharray="3 3"/><text x="380" y="222" font-size="9.5" font-weight="700" fill="#512DA8">Fase 1: Control de Concurrencia Mutex</text><path d="M435,240 L600,240" stroke="#8E24AA" stroke-width="1.4" marker-end="url(#arr)"/><text x="517" y="234" font-size="9.5" fill="#512DA8" text-anchor="middle">3: adquirirLock("lock:slot:4580", 10000ms)</text><path d="M600,265 L435,265" stroke="#8E24AA" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)"/><text x="517" y="259" font-size="9.5" fill="#512DA8" text-anchor="middle">4: lock concedido = true</text><rect x="370" y="295" width="870" height="240" fill="#E8F5E9" stroke="#A5D6A7" stroke-dasharray="3 3"/><text x="380" y="312" font-size="9.5" font-weight="700" fill="#1B5E20">Fase 2 &amp; 3: Validación Clínica y Persistencia Transaccional ACID</text><path d="M435,335 L770,335" stroke="#1E293B" stroke-width="1.4" marker-end="url(#arr)"/><text x="602" y="328" font-size="9.5" fill="#1E293B" text-anchor="middle">5: obtenerPorIdConBloqueo(slotId)</text><path d="M770,360 L435,360" stroke="#1E293B" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)"/><text x="602" y="353" font-size="9.5" fill="#1E293B" text-anchor="middle">6: retorna TurnoSlot (DISPONIBLE)</text><path d="M435,395 L945,395" stroke="#E65100" stroke-width="1.4" marker-end="url(#arr)"/><text x="690" y="388" font-size="9.5" fill="#E65100" text-anchor="middle">7: validarElegibilidad(pacienteId, especialidadId)</text><path d="M945,420 L435,420" stroke="#E65100" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)"/><text x="690" y="413" font-size="9.5" fill="#E65100" text-anchor="middle">8: validación OK (sin cruces ni topes)</text><path d="M435,455 L770,455" stroke="#1E293B" stroke-width="1.4" marker-end="url(#arr)"/><text x="602" y="448" font-size="9.5" fill="#1E293B" text-anchor="middle">9: slot.marcarComoReservado()</text><path d="M435,485 L1110,485" stroke="#1E293B" stroke-width="1.4" marker-end="url(#arr)"/><text x="772" y="478" font-size="9.5" fill="#1E293B" text-anchor="middle">10: Cita.crear(props) &amp; guardar(nuevaCita)</text><path d="M1110,510 L435,510" stroke="#1E293B" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)"/><text x="772" y="503" font-size="9.5" fill="#1E293B" text-anchor="middle">11: Cita persistida (ID: cita-9981)</text><path d="M435,560 L1275,560" stroke="#8E24AA" stroke-width="1.4" marker-end="url(#arr)"/><text x="855" y="552" font-size="9.5" fill="#8E24AA" text-anchor="middle">12: publicar(CitaReservadaEvent)</text><path d="M435,595 L600,595" stroke="#8E24AA" stroke-width="1.4" marker-end="url(#arr)"/><text x="517" y="588" font-size="9.5" fill="#8E24AA" text-anchor="middle">13: liberarLock("lock:slot:4580")</text><path d="M600,620 L435,620" stroke="#8E24AA" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)"/><text x="517" y="613" font-size="9.5" fill="#8E24AA" text-anchor="middle">14: lock liberado</text><path d="M435,660 L260,660" stroke="#1E293B" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)"/><text x="345" y="652" font-size="9.5" fill="#1E293B" text-anchor="middle">15: retorna CitaResponseDTO</text><path d="M260,700 L115,700" stroke="#2E7D32" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrG)"/><text x="185" y="692" font-size="10.5" font-weight="700" fill="#2E7D32" text-anchor="middle">16: HTTP 201 Created (Comprobante Cita)</text><path d="M1280,720 L1350,720 L1350,750 L1280,750" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)"/><text x="1355" y="738" font-size="9" fill="#64748B" text-anchor="start">17 [Asíncrono]: Workers consumen y despachan WhatsApp</text><g transform="translate(60, 830)"><rect width="1320" height="60" fill="#FFFFFF" stroke="#B7B7B7"/><text x="15" y="20" font-size="11" font-weight="700" fill="#1A1A1A">Garantías del Flujo de Reserva Atómica</text><text x="15" y="36" font-size="10" fill="#333333">• Pasos 3 a 4: El candado distribuido en Redis evita que dos usuarios reserven el mismo cupo al mismo milisegundo (&lt; 10 ms).</text><text x="15" y="50" font-size="10" fill="#333333">• Pasos 9 a 11: La actualización del slot y la inserción de la cita se ejecutan en una transacción ACID en PostgreSQL.</text></g></svg>