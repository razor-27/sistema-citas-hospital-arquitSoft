<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img"><title>Principio de Inversión de Dependencias (DIP)</title><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#475569" stroke-width="1.4"/></marker><marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L11,6 L0,12 z" fill="#fff" stroke="#475569" stroke-width="1.2"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="20" y="26" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start">Principio de Inversión de Dependencias (DIP) · Módulo Citas</text><text x="20" y="45" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">Los módulos de alto nivel no dependen de la tecnología concreta; ambos dependen de abstracciones (Puertos)</text><rect x="25" y="80" width="370" height="200" fill="#FFEBEE" stroke="#E57373" stroke-width="1.3" stroke-dasharray="5 4"/><text x="35" y="100" font-size="11.5" font-weight="700" fill="#C62828">SIN DIP (Acoplamiento Rígido a Base de Datos)</text><rect x="60" y="120" width="300" height="45" fill="#FFFFFF" stroke="#E57373" stroke-width="1.2"/><text x="210" y="147" font-size="11.5" font-weight="700" fill="#1E293B" text-anchor="middle">ReservarCitaUseCase</text><rect x="60" y="215" width="300" height="45" fill="#FFFFFF" stroke="#E57373" stroke-width="1.2"/><text x="210" y="242" font-size="11.5" font-weight="700" fill="#1E293B" text-anchor="middle">PostgreSQL / TypeORM Directo</text><path d="M210,165 L210,210" fill="none" stroke="#C62828" stroke-width="1.5" marker-end="url(#arrRed)"/><text x="215" y="192" font-size="9.5" fill="#C62828" text-anchor="start">depende de</text><rect x="430" y="80" width="405" height="200" fill="#E8F5E9" stroke="#81C784" stroke-width="1.3" stroke-dasharray="5 4"/><text x="440" y="100" font-size="11.5" font-weight="700" fill="#2E7D32">CON DIP (Clean Architecture / Puertos)</text><rect x="450" y="120" width="180" height="45" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.2"/><text x="540" y="147" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">ReservarCitaUseCase</text><rect x="655" y="120" width="165" height="45" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.2"/><text x="737" y="140" font-size="9" fill="#856404" text-anchor="middle">«interface · puerto»</text><text x="737" y="153" font-size="10.5" font-weight="700" fill="#1E293B" text-anchor="middle" font-style="italic">CitaRepositoryPort</text><rect x="655" y="215" width="165" height="45" fill="#FFFFFF" stroke="#6D4AA8" stroke-width="1.2"/><text x="737" y="235" font-size="9" fill="#6D4AA8" text-anchor="middle">«adaptador»</text><text x="737" y="248" font-size="10.5" font-weight="700" fill="#1E293B" text-anchor="middle">PostgresCitaRepo</text><path d="M630,142.5 L650,142.5" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#o)"/><text x="640" y="136" font-size="8.5" fill="#64748B" text-anchor="middle">usa</text><path d="M737.5,215 L737.5,170" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#t)"/><text x="742" y="195" font-size="8.5" fill="#64748B" text-anchor="start">implementa</text><rect x="25" y="300" width="810" height="55" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/><text x="35" y="322" font-size="10.5" font-weight="700" fill="#1E293B">Beneficio inmediato en el Hospital:</text><text x="35" y="340" font-size="10" fill="#475569">El caso de uso de reserva se prueba en 2 ms usando un InMemoryCitaRepository sin requerir levantar PostgreSQL ni Redis.</text></svg>