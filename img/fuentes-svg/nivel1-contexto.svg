<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img"><title>Diagrama de contexto del Sistema de Citas Médicas</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#707070"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="38" font-size="18" font-weight="700" fill="#1A1A1A">[Diagrama de contexto del sistema] Sistema de Citas Médicas – Hospital de Huamanga</text><text x="40" y="60" font-size="12" fill="#555555">Modelo C4 · Nivel 1 · Quién usa el sistema y con qué sistemas externos se comunica</text><text x="1160" y="38" font-size="11" fill="#777777" text-anchor="end">Vista de contexto · v1.0</text><g transform="translate(95, 90)"><circle cx="65" cy="20" r="20" fill="#08427B" stroke="#073B6F"/><rect x="0" y="34" width="130" height="78" rx="8" fill="#08427B" stroke="#073B6F"/><text x="65" y="55" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Paciente / Familiar</text><text x="65" y="68" font-size="9" fill="#E6E6E6" text-anchor="middle">[Persona]</text><text x="65" y="82" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Busca, agenda y</text><text x="65" y="94" font-size="9.5" fill="#FFFFFF" text-anchor="middle">cancela sus citas</text></g><g transform="translate(375, 90)"><circle cx="65" cy="20" r="20" fill="#08427B" stroke="#073B6F"/><rect x="0" y="34" width="130" height="78" rx="8" fill="#08427B" stroke="#073B6F"/><text x="65" y="55" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Personal de Admisión</text><text x="65" y="68" font-size="9" fill="#E6E6E6" text-anchor="middle">[Persona]</text><text x="65" y="82" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Ventanilla, sobrecupos</text><text x="65" y="94" font-size="9.5" fill="#FFFFFF" text-anchor="middle">y valida cobertura</text></g><g transform="translate(655, 90)"><circle cx="65" cy="20" r="20" fill="#08427B" stroke="#073B6F"/><rect x="0" y="34" width="130" height="78" rx="8" fill="#08427B" stroke="#073B6F"/><text x="65" y="55" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Médico Especialista</text><text x="65" y="68" font-size="9" fill="#E6E6E6" text-anchor="middle">[Persona]</text><text x="65" y="82" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Consulta agenda diaria</text><text x="65" y="94" font-size="9.5" fill="#FFFFFF" text-anchor="middle">y pacientes en sala</text></g><g transform="translate(935, 90)"><circle cx="65" cy="20" r="20" fill="#08427B" stroke="#073B6F"/><rect x="0" y="34" width="130" height="78" rx="8" fill="#08427B" stroke="#073B6F"/><text x="65" y="55" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Jefatura / TI</text><text x="65" y="68" font-size="9" fill="#E6E6E6" text-anchor="middle">[Persona]</text><text x="65" y="82" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Oferta médica mensual</text><text x="65" y="94" font-size="9.5" fill="#FFFFFF" text-anchor="middle">y apertura de agendas</text></g><g transform="translate(380, 320)"><rect x="0" y="0" width="440" height="130" rx="8" fill="#1168BD" stroke="#0B4884"/><text x="220" y="38" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sistema de Citas Médicas</text><text x="220" y="54" font-size="10" fill="#E6E6E6" text-anchor="middle">[Sistema de software · Hospital de Huamanga]</text><text x="220" y="78" font-size="11" fill="#FFFFFF" text-anchor="middle">Gestión integral de consulta externa, oferta médica,</text><text x="220" y="95" font-size="11" fill="#FFFFFF" text-anchor="middle">agendamiento atómico anti-doble reserva y check-in asistencial</text></g><path d="M160,202 L160,360 L380,360" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arr)"/><rect x="180" y="348" width="170" height="22" fill="#FFFFFF"/><text x="265" y="363" font-size="10" fill="#404040" text-anchor="middle">Busca cupos y agenda cita</text><path d="M440,202 L440,320" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arr)"/><rect x="365" y="245" width="150" height="22" fill="#FFFFFF"/><text x="440" y="260" font-size="10" fill="#404040" text-anchor="middle">Registra cita en ventanilla</text><path d="M720,202 L720,320" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arr)"/><rect x="650" y="245" width="140" height="22" fill="#FFFFFF"/><text x="720" y="260" font-size="10" fill="#404040" text-anchor="middle">Consulta citados y turnos</text><path d="M1000,202 L1000,360 L820,360" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arr)"/><rect x="850" y="348" width="130" height="22" fill="#FFFFFF"/><text x="915" y="363" font-size="10" fill="#404040" text-anchor="middle">Apertura de agenda</text><g transform="translate(60, 560)"><rect x="0" y="0" width="230" height="74" rx="8" fill="#999999" stroke="#8A8A8A"/><text x="115" y="28" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">RENIEC</text><text x="115" y="42" font-size="9" fill="#E6E6E6" text-anchor="middle">[Sistema externo]</text><text x="115" y="58" font-size="10" fill="#FFFFFF" text-anchor="middle">Valida datos de identidad por DNI</text></g><g transform="translate(350, 560)"><rect x="0" y="0" width="230" height="74" rx="8" fill="#999999" stroke="#8A8A8A"/><text x="115" y="28" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">SIS / Aseguradoras</text><text x="115" y="42" font-size="9" fill="#E6E6E6" text-anchor="middle">[Sistema externo]</text><text x="115" y="58" font-size="10" fill="#FFFFFF" text-anchor="middle">Verifica vigencia de afiliación</text></g><g transform="translate(640, 560)"><rect x="0" y="0" width="230" height="74" rx="8" fill="#999999" stroke="#8A8A8A"/><text x="115" y="28" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Plataforma Multicanal</text><text x="115" y="42" font-size="9" fill="#E6E6E6" text-anchor="middle">[Sistema externo]</text><text x="115" y="58" font-size="10" fill="#FFFFFF" text-anchor="middle">WhatsApp Cloud API, SMS y Email</text></g><g transform="translate(930, 560)"><rect x="0" y="0" width="230" height="74" rx="8" fill="#999999" stroke="#8A8A8A"/><text x="115" y="28" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">HIS MINSA / SIHCE</text><text x="115" y="42" font-size="9" fill="#E6E6E6" text-anchor="middle">[Sistema externo]</text><text x="115" y="58" font-size="10" fill="#FFFFFF" text-anchor="middle">Reportes oficiales y turnos</text></g><path d="M440,450 L440,505 L175,505 L175,560" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arr)"/><rect x="195" y="495" width="150" height="20" fill="#FFFFFF"/><text x="270" y="509" font-size="10" fill="#404040" text-anchor="middle">Valida DNI [HTTPS/REST]</text><path d="M530,450 L530,505 L465,505 L465,560" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arr)"/><rect x="470" y="495" width="160" height="20" fill="#FFFFFF"/><text x="550" y="509" font-size="10" fill="#404040" text-anchor="middle">Consulta seguro [HTTPS]</text><path d="M670,450 L670,505 L755,505 L755,560" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arr)"/><rect x="680" y="495" width="160" height="20" fill="#FFFFFF"/><text x="760" y="509" font-size="10" fill="#404040" text-anchor="middle">Despacha alertas [HTTPS]</text><path d="M760,450 L760,505 L1045,505 L1045,560" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arr)"/><rect x="940" y="495" width="160" height="20" fill="#FFFFFF"/><text x="1020" y="509" font-size="10" fill="#404040" text-anchor="middle">Reporta turnos [HL7 FHIR]</text><g transform="translate(40, 715)"><rect width="520" height="92" fill="#FFFFFF" stroke="#B7B7B7"/><text x="15" y="20" font-size="11" font-weight="700" fill="#1A1A1A">Leyenda</text><rect x="15" y="32" width="130" height="26" rx="6" fill="#08427B"/><text x="80" y="49" font-size="10" fill="#FFFFFF" text-anchor="middle">Persona</text><rect x="160" y="32" width="140" height="26" rx="6" fill="#1168BD"/><text x="230" y="49" font-size="10" fill="#FFFFFF" text-anchor="middle">Sistema en alcance</text><rect x="315" y="32" width="130" height="26" rx="6" fill="#999999"/><text x="380" y="49" font-size="10" fill="#FFFFFF" text-anchor="middle">Sistema externo</text><text x="15" y="78" font-size="10" fill="#555555">Flecha: relación (verbo + [protocolo]) · Línea discontinua: frontera</text></g><g transform="translate(600, 715)"><rect width="560" height="92" fill="#FFFFFF" stroke="#B7B7B7"/><text x="15" y="20" font-size="11" font-weight="700" fill="#1A1A1A">Alcance y Fronteras</text><text x="15" y="38" font-size="10" fill="#333333">• En azul: Sistema central de Citas Médicas del Hospital de Huamanga.</text><text x="15" y="54" font-size="10" fill="#333333">• En gris: Servicios externos del Estado peruano y pasarelas de comunicación.</text><text x="15" y="70" font-size="10" fill="#333333">• El detalle de contenedores y servicios se muestra en el Nivel 2.</text></g></svg>