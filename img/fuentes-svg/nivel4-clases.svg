<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" width="1440" height="1020" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img"><title>Diagrama de clases del Módulo Citas</title><defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#475569" stroke-width="1.4"/></marker><marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L11,6 L0,12 z" fill="#fff" stroke="#475569" stroke-width="1.2"/></marker><marker id="d" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="38" font-size="18" font-weight="700" fill="#1A1A1A">[Diagrama de clases UML] Módulo Citas y Módulo Agenda – Clean Architecture</text><text x="40" y="60" font-size="12" fill="#555555">Modelo C4 · Nivel 4 · Estructura de clases, puertos y adaptadores para el flujo de Reserva Atómica</text><text x="1400" y="38" font-size="11" fill="#777777" text-anchor="end">Vista de código · v1.0</text><g transform="translate(40, 90)"><rect width="260" height="300" fill="#EBF3FB" stroke="#4A90E2" stroke-dasharray="5 5"/><text x="12" y="24" font-size="11" font-weight="700" fill="#1B365D">Capa de Presentación</text><g transform="translate(15, 40)"><rect width="230" height="100" fill="#FFFFFF" stroke="#4A90E2"/><text x="12" y="24" font-size="12" font-weight="700" fill="#1A1A1A">CitaController</text><text x="12" y="38" font-size="9" fill="#555555">«controlador web / app»</text><line x1="0" y1="45" x2="230" y2="45" stroke="#4A90E2"/><text x="12" y="62" font-size="10" fill="#1A1A1A">+ reservar(req, res): Promise</text><text x="12" y="78" font-size="10" fill="#1A1A1A">+ cancelar(req, res): Promise</text><text x="12" y="94" font-size="10" fill="#1A1A1A">+ reprogramar(req, res): Promise</text></g><g transform="translate(15, 160)"><rect width="230" height="110" fill="#FFFFFF" stroke="#4A90E2"/><text x="12" y="24" font-size="12" font-weight="700" fill="#1A1A1A">AdmisionCitaController</text><text x="12" y="38" font-size="9" fill="#555555">«controlador ventanilla»</text><line x1="0" y1="45" x2="230" y2="45" stroke="#4A90E2"/><text x="12" y="62" font-size="10" fill="#1A1A1A">+ reservarVentanilla(req, res)</text><text x="12" y="78" font-size="10" fill="#1A1A1A">+ autorizarSobrecupo(req, res)</text><text x="12" y="94" font-size="10" fill="#1A1A1A">+ realizarCheckIn(req, res)</text></g></g><g transform="translate(340, 90)"><rect width="310" height="300" fill="#E8F5E9" stroke="#2E7D32" stroke-dasharray="5 5"/><text x="12" y="24" font-size="11" font-weight="700" fill="#1B5E20">Capa de Aplicación</text><g transform="translate(15, 40)"><rect width="280" height="150" fill="#FFFFFF" stroke="#2E7D32"/><text x="12" y="24" font-size="12" font-weight="700" fill="#1A1A1A">ReservarCitaUseCase</text><text x="12" y="38" font-size="9" fill="#555555">«caso de uso orquestador»</text><line x1="0" y1="45" x2="280" y2="45" stroke="#2E7D32"/><text x="12" y="60" font-size="9.5" fill="#333333">- citaRepo: CitaRepositoryPort</text><text x="12" y="74" font-size="9.5" fill="#333333">- turnoRepo: TurnoSlotPort</text><text x="12" y="88" font-size="9.5" fill="#333333">- lockService: DistributedLockPort</text><text x="12" y="102" font-size="9.5" fill="#333333">- politicaService: PoliticaReservaService</text><text x="12" y="116" font-size="9.5" fill="#333333">- eventPub: EventPublisherPort</text><line x1="0" y1="124" x2="280" y2="124" stroke="#2E7D32"/><text x="12" y="140" font-size="10" font-weight="700" fill="#1A1A1A">+ ejecutar(cmd): Promise&lt;CitaDTO&gt;</text></g><g transform="translate(15, 210)"><rect width="200" height="70" fill="#FFFFFF" stroke="#2E7D32"/><text x="12" y="22" font-size="11" font-weight="700" fill="#1A1A1A">ReservarCitaDTO</text><text x="12" y="35" font-size="8.5" fill="#555555">«command data»</text><line x1="0" y1="40" x2="200" y2="40" stroke="#2E7D32"/><text x="12" y="55" font-size="9.5" fill="#333333">+ slotId, pacienteId, espId</text></g></g><g transform="translate(690, 90)"><rect width="710" height="570" fill="#FFF8E1" stroke="#F57F17" stroke-dasharray="5 5"/><text x="12" y="24" font-size="11" font-weight="700" fill="#E65100">Capa de Dominio (Core Clínico &amp; Puertos)</text><g transform="translate(20, 40)"><rect width="220" height="170" fill="#FFFFFF" stroke="#F57F17"/><text x="12" y="24" font-size="12" font-weight="700" fill="#1A1A1A">Cita</text><text x="12" y="38" font-size="9" fill="#555555">«entidad agregado raíz»</text><line x1="0" y1="45" x2="220" y2="45" stroke="#F57F17"/><text x="12" y="60" font-size="9.5" fill="#333333">+ id, codigoReserva, slotId</text><text x="12" y="74" font-size="9.5" fill="#333333">+ pacienteId, fechaHora</text><text x="12" y="88" font-size="9.5" fill="#333333">- estado: EstadoCita</text><line x1="0" y1="95" x2="220" y2="95" stroke="#F57F17"/><text x="12" y="112" font-size="9.5" fill="#1A1A1A">+ crear(props): Cita$</text><text x="12" y="128" font-size="9.5" fill="#1A1A1A">+ confirmar(): void</text><text x="12" y="144" font-size="9.5" fill="#1A1A1A">+ cancelar(motivo): void</text><text x="12" y="160" font-size="9.5" fill="#1A1A1A">+ realizarCheckIn(): void</text></g><g transform="translate(270, 40)"><rect width="210" height="150" fill="#FFFFFF" stroke="#F57F17"/><text x="12" y="24" font-size="12" font-weight="700" fill="#1A1A1A">TurnoSlot</text><text x="12" y="38" font-size="9" fill="#555555">«entidad de agenda»</text><line x1="0" y1="45" x2="210" y2="45" stroke="#F57F17"/><text x="12" y="60" font-size="9.5" fill="#333333">+ id, medicoId, consultorioId</text><text x="12" y="74" font-size="9.5" fill="#333333">+ horario: HorarioConsulta</text><text x="12" y="88" font-size="9.5" fill="#333333">- estado: EstadoSlot</text><line x1="0" y1="95" x2="210" y2="95" stroke="#F57F17"/><text x="12" y="112" font-size="9.5" fill="#1A1A1A">+ estaDisponible(): boolean</text><text x="12" y="128" font-size="9.5" fill="#1A1A1A">+ marcarComoReservado()</text><text x="12" y="142" font-size="9.5" fill="#1A1A1A">+ liberar(): void</text></g><g transform="translate(510, 40)"><rect width="180" height="110" fill="#FFFFFF" stroke="#F57F17"/><text x="12" y="20" font-size="11" font-weight="700" fill="#1A1A1A">EstadoCita</text><text x="12" y="32" font-size="8.5" fill="#555555">«enumeration»</text><line x1="0" y1="36" x2="180" y2="36" stroke="#F57F17"/><text x="12" y="52" font-size="9" fill="#333333">RESERVADA</text><text x="12" y="66" font-size="9" fill="#333333">CONFIRMADA</text><text x="12" y="80" font-size="9" fill="#333333">EN_SALA</text><text x="12" y="94" font-size="9" fill="#333333">ATENDIDA / CANCELADA</text></g><g transform="translate(20, 230)"><rect width="230" height="75" fill="#FFFFFF" stroke="#F57F17"/><text x="12" y="20" font-size="11" font-weight="700" fill="#1A1A1A">PoliticaReservaService</text><text x="12" y="32" font-size="8.5" fill="#555555">«servicio de dominio»</text><line x1="0" y1="36" x2="230" y2="36" stroke="#F57F17"/><text x="12" y="52" font-size="9.5" fill="#333333">+ validarElegibilidad(pac, esp)</text><text x="12" y="68" font-size="9.5" fill="#333333">+ validarAntelacionMinima(f)</text></g><g transform="translate(20, 330)"><rect width="250" height="80" fill="#FFFDE7" stroke="#F57F17"/><text x="12" y="20" font-size="11" font-style="italic" font-weight="700" fill="#856404">«interface» CitaRepositoryPort</text><line x1="0" y1="28" x2="250" y2="28" stroke="#F57F17"/><text x="12" y="46" font-size="9.5" fill="#333333">+ guardar(cita: Cita): Promise</text><text x="12" y="60" font-size="9.5" fill="#333333">+ buscarPorId(id): Promise</text><text x="12" y="74" font-size="9.5" fill="#333333">+ buscarPorCodigo(c): Promise</text></g><g transform="translate(290, 230)"><rect width="250" height="75" fill="#FFFDE7" stroke="#F57F17"/><text x="12" y="20" font-size="11" font-style="italic" font-weight="700" fill="#856404">«interface» TurnoSlotPort</text><line x1="0" y1="28" x2="250" y2="28" stroke="#F57F17"/><text x="12" y="46" font-size="9.5" fill="#333333">+ obtenerPorIdConBloqueo(id)</text><text x="12" y="62" font-size="9.5" fill="#333333">+ actualizar(slot: TurnoSlot)</text></g><g transform="translate(290, 330)"><rect width="260" height="80" fill="#FFFDE7" stroke="#F57F17"/><text x="12" y="20" font-size="11" font-style="italic" font-weight="700" fill="#856404">«interface» DistributedLockPort</text><line x1="0" y1="28" x2="260" y2="28" stroke="#F57F17"/><text x="12" y="46" font-size="9.5" fill="#333333">+ adquirirLock(rec, ttlMs): Promise</text><text x="12" y="62" font-size="9.5" fill="#333333">+ liberarLock(rec): Promise</text></g><g transform="translate(290, 430)"><rect width="260" height="60" fill="#FFFDE7" stroke="#F57F17"/><text x="12" y="20" font-size="11" font-style="italic" font-weight="700" fill="#856404">«interface» EventPublisherPort</text><line x1="0" y1="28" x2="260" y2="28" stroke="#F57F17"/><text x="12" y="46" font-size="9.5" fill="#333333">+ publicar(evento: DomainEvent)</text></g></g><g transform="translate(340, 690)"><rect width="1060" height="230" fill="#F3E5F5" stroke="#8E24AA" stroke-dasharray="5 5"/><text x="12" y="24" font-size="11" font-weight="700" fill="#4A148C">Capa de Infraestructura (Adaptadores Secundarios)</text><g transform="translate(20, 40)"><rect width="230" height="75" fill="#FFFFFF" stroke="#8E24AA"/><text x="12" y="22" font-size="11.5" font-weight="700" fill="#1A1A1A">PostgresCitaRepository</text><text x="12" y="34" font-size="8.5" fill="#555555">«adaptador BD»</text><line x1="0" y1="38" x2="230" y2="38" stroke="#8E24AA"/><text x="12" y="54" font-size="9.5" fill="#333333">+ guardar(cita: Cita)</text><text x="12" y="68" font-size="9.5" fill="#333333">+ buscarPorId(id)</text></g><g transform="translate(270, 40)"><rect width="230" height="75" fill="#FFFFFF" stroke="#8E24AA"/><text x="12" y="22" font-size="11.5" font-weight="700" fill="#1A1A1A">PostgresTurnoSlotRepository</text><text x="12" y="34" font-size="8.5" fill="#555555">«adaptador BD»</text><line x1="0" y1="38" x2="230" y2="38" stroke="#8E24AA"/><text x="12" y="54" font-size="9.5" fill="#333333">+ obtenerPorIdConBloqueo(id)</text><text x="12" y="68" font-size="9.5" fill="#333333">+ actualizar(slot)</text></g><g transform="translate(520, 40)"><rect width="240" height="75" fill="#FFFFFF" stroke="#8E24AA"/><text x="12" y="22" font-size="11.5" font-weight="700" fill="#1A1A1A">RedisDistributedLockAdapter</text><text x="12" y="34" font-size="8.5" fill="#555555">«adaptador Redis»</text><line x1="0" y1="38" x2="240" y2="38" stroke="#8E24AA"/><text x="12" y="54" font-size="9.5" fill="#333333">+ adquirirLock(rec, ttlMs)</text><text x="12" y="68" font-size="9.5" fill="#333333">+ liberarLock(rec)</text></g><g transform="translate(780, 40)"><rect width="240" height="75" fill="#FFFFFF" stroke="#8E24AA"/><text x="12" y="22" font-size="11.5" font-weight="700" fill="#1A1A1A">RabbitMQEventPublisher</text><text x="12" y="34" font-size="8.5" fill="#555555">«adaptador Broker»</text><line x1="0" y1="38" x2="240" y2="38" stroke="#8E24AA"/><text x="12" y="54" font-size="9.5" fill="#333333">+ publicar(evento: DomainEvent)</text></g></g><path d="M285,180 L355,180" fill="none" stroke="#707070" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#o)"/><text x="320" y="172" font-size="9" fill="#64748B" text-anchor="middle">invoca</text><path d="M635,180 L710,180" fill="none" stroke="#707070" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#o)"/><text x="672" y="172" font-size="9" fill="#64748B" text-anchor="middle">crea</text><path d="M930,170 L960,170" fill="none" stroke="#707070" stroke-width="1.4" marker-end="url(#d)"/><path d="M475,730 L475,450 L710,450" fill="none" stroke="#707070" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#t)"/><path d="M725,730 L725,520 L980,520" fill="none" stroke="#707070" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#t)"/><path d="M980,730 L980,450" fill="none" stroke="#707070" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#t)"/><path d="M1240,730 L1240,550" fill="none" stroke="#707070" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#t)"/><g transform="translate(40, 940)"><rect width="1360" height="65" fill="#FFFFFF" stroke="#B7B7B7"/><text x="15" y="20" font-size="11" font-weight="700" fill="#1A1A1A">Reglas de Dependencia en Clean Architecture (Nivel 4)</text><text x="15" y="38" font-size="10" fill="#333333">• La capa de Dominio no importa frameworks ni BD. Los puertos son interfaces puras.</text><text x="15" y="52" font-size="10" fill="#333333">• La Infraestructura implementa los puertos mediante adaptadores concretos (línea discontinua con triángulo).</text></g></svg>