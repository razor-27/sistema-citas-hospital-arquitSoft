<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img"><title>Diagrama de contenedores del Sistema de Citas Médicas</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#707070"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="38" font-size="18" font-weight="700" fill="#1A1A1A">[Diagrama de contenedores] Sistema de Citas Médicas – Hospital de Huamanga</text><text x="40" y="60" font-size="12" fill="#555555">Modelo C4 · Nivel 2 · Aplicaciones, servicios, colas y almacenes de datos que forman el sistema</text><text x="1360" y="38" font-size="11" fill="#777777" text-anchor="end">Vista de contenedores · v1.0</text><g transform="translate(210, 80)"><circle cx="60" cy="20" r="20" fill="#08427B" stroke="#073B6F"/><rect x="0" y="34" width="120" height="74" rx="8" fill="#08427B" stroke="#073B6F"/><text x="60" y="55" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Paciente</text><text x="60" y="68" font-size="9" fill="#E6E6E6" text-anchor="middle">[Persona]</text><text x="60" y="82" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Reserva y check-in</text></g><g transform="translate(470, 80)"><circle cx="60" cy="20" r="20" fill="#08427B" stroke="#073B6F"/><rect x="0" y="34" width="120" height="74" rx="8" fill="#08427B" stroke="#073B6F"/><text x="60" y="55" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Admisión</text><text x="60" y="68" font-size="9" fill="#E6E6E6" text-anchor="middle">[Persona]</text><text x="60" y="82" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Ventanilla hospital</text></g><g transform="translate(730, 80)"><circle cx="60" cy="20" r="20" fill="#08427B" stroke="#073B6F"/><rect x="0" y="34" width="120" height="74" rx="8" fill="#08427B" stro