)"><rect width="220" height="84" rx="6" fill="#438DD5" stroke="#3C7FC0"/><text x="110" y="28" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Balanceador &amp; WAF</text><text x="110" y="42" font-size="9" fill="#E6E6E6" text-anchor="middle">[Contenedor: Nginx / ALB]</text><text x="110" y="58" font-size="9.5" fill="#FFFFFF" text-anchor="middle">TLS 1.3 y Rate Limiting</text></g><g transform="translate(290, 200)"><rect width="440" height="150" rx="8" fill="#438DD5" stroke="#3C7FC0"/><text x="220" y="35" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">API Sistema de Citas</text><text x="220" y="50" font-size="9.5" fill="#E6E6E6" text-anchor="middle">[Contenedor: Node.js + NestJS / TypeScript]</text><text x="220" y="75" font-size="11" fill="#FFFFFF" text-anchor="middle">Monolito Modular con Clean Architecture.</text><text x="220" y="92" font-size="11" fill="#FFFFFF" text-anchor="middle">Reglas de cupo, distributed locks y eventos de dominio</text><text x="220" y="112" font-size="10" fill="#E6E6E6" text-anchor="middle">(Stateless · Escalable de 2 a 10 réplicas)</text></g><g transform="translate(50, 480)"><path d="M0,20 C0,10 50,0 110,0 C170,0 220,10 220,20 L220,95 C220,105 170,115 110,115 C50,115 0,105 0,95 Z" fill="#438DD5" stroke="#3C7FC0"/><path d="M0,20 C0,30 50,40 110,40 C170,40 220,30 220,20" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><text x="110" y="55" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Base de Datos</text><text x="110" y="70" font-size="9.5" fill="#E6E6E6" text-anchor="middle">[Contenedor: PostgreSQL 16]</text><text x="110" y="85" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Citas, turnos y auditoría ACID</text></g><g transform="translate(390, 480)"><path d="M0,20 C0,10 50,0 110,0 C170,0 220,10 220,20 L220,95 C220,105 170,115 110,115 C50,115 0,105 0,95 Z" fill="#438DD5" stroke="#3C7FC0"/><path d="M0,20 C0,30 50,40 110,40 C170,40 220,30 220,20" fill="none" stroke="#FFFFFF" s