<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img"><title>Componentes Arquitectónicos de Clean Architecture</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E293B"/></marker><marker id="arrT" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L11,6 L0,12 z" fill="#fff" stroke="#6D4AA8" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="38" font-size="18" font-weight="700" fill="#1A1A1A">Componentes Arquitectónicos de Clean Architecture – Sistema de Citas</text><text x="40" y="60" font-size="12" fill="#555555">Hospital de Huamanga · Mapeo de responsabilidades, puertos de entrada/salida y flujo de control</text><g transform="translate(40, 100)"><rect width="250" height="100" rx="6" fill="#EAF1FB" stroke="#2F5FA7" stroke-width="1.5"/><text x="125" y="30" font-size="13" font-weight="700" fill="#1B365D" text-anchor="middle">Capa de Presentación</text><text x="125" y="52" font-size="10.5" fill="#333333" text-anchor="middle">CitaController · VentanillaController</text><text x="125" y="70" font-size="10" fill="#666666" text-anchor="middle">Request/Response DTOs · Guards JWT</text></g><g transform="translate(370, 100)"><rect width="300" height="100" rx="6" fill="#E8F3EC" stroke="#2F7D4F" stroke-width="1.5"/><text x="150" y="30" font-size="13" font-weight="700" fill="#1B5E20" text-anchor="middle">Capa de Aplicación</text><text x="150" y="52" font-size="10.5" fill="#333333" text-anchor="middle">ReservarCitaUseCase · CancelarCitaUseCase</text><text x="150" y="70" font-size="10" fill="#666666" text-anchor="middle">Orquestación transaccional y Comandos DTO</text></g><g transform="translate(750, 100)"><rect width="300" height="100" rx="6" fill="#FDF3E3" stroke="#B7791F" stroke-width="1.5"/><text x="150" y="30" font-size="13" font-weight="700" fill="#E65100" text-anchor="middle">Capa de Dominio</text><text x="150" y="52" font-size="10.5" fill="#333333" text-anchor="middle">Entidades Cita &amp; TurnoSlot · Value Objects</text><text x="150" y="70" font-size="10" fill="#666666" text-anchor="middle">PoliticaReservaService · Puertos (Interfaces)</text></g><g transform="translate(750, 270)"><rect width="300" height="100" rx="6" fill="#F1ECF9" stroke="#6D4AA8" stroke-width="1.5"/><text x="150" y="30" font-size="13" font-weight="700" fill="#4A148C" text-anchor="middle">Capa de Infraestructura</text><text x="150" y="52" font-size="10.5" fill="#333333" text-anchor="middle">PostgresCitaRepo · RedisLockAdapter</text><text x="150" y="70" font-size="10" fill="#666666" text-anchor="middle">RabbitMQPublisher · SISResilientAdapter</text></g><path d="M290,150 L362,150" stroke="#2F7D4F" stroke-width="2" marker-end="url(#arr)"/><text x="326" y="142" font-size="9" fill="#2F7D4F" text-anchor="middle">invoca</text><path d="M670,150 L742,150" stroke="#B7791F" stroke-width="2" marker-end="url(#arr)"/><text x="706" y="142" font-size="9" fill="#B7791F" text-anchor="middle">aplica reglas</text><path d="M900,270 L900,208" stroke="#6D4AA8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrT)"/><text x="910" y="240" font-size="9" fill="#6D4AA8" text-anchor="start">implementa puertos</text><g transform="translate(40, 420)"><rect width="1010" height="105" fill="#FFFFFF" stroke="#B7B7B7"/><text x="15" y="24" font-size="11.5" font-weight="700" fill="#1A1A1A">Aislamiento y Trazabilidad de los Componentes Arquitectónicos</text><text x="15" y="46" font-size="10.5" fill="#333333">1. El flujo de control nace en Presentación, viaja a Aplicación y consulta el Dominio clínico.</text><text x="15" y="66" font-size="10.5" fill="#333333">2. La dirección de las dependencias de código apunta SIEMPRE hacia el Dominio (Inversión de Dependencias - DIP).</text><text x="15" y="86" font-size="10.5" fill="#333333">3. Los datos viajan encapsulados en DTOs inmutables para no exponer entidades a la vista ni tecnologías a la lógica clínica.</text></g></svg>